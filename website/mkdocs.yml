site_name: Stepminia
site_description: Mini Stepmania dance-pad for desktop finger gaming.
site_url: https://stepminia.andrewcromar.org/
repo_url: https://github.com/AndrewCromar/stepminia
repo_name: AndrewCromar/stepminia

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.indexes      # guide/index.md acts as the Guide landing page
    - navigation.top          # back-to-top button
    - navigation.footer       # prev/next page links at the bottom
    - navigation.tracking     # URL updates to the section anchor while scrolling
    - navigation.instant      # SPA-like instant page loads (no full reload)
    - navigation.instant.progress
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - attr_list
  - md_in_html        # enables the image grid in gallery.md
  - admonition
  - pymdownx.superfences   # code blocks for firmware snippets

nav:
  - Home: index.md
  - Guide:
      - Overview: guide/index.md
      - PCB: guide/pcb.md
      - Firmware: guide/firmware.md
  - Noob Guide:
      - Overview: noobguide/index.md
      - Gathering Parts:
          - Overview: noobguide/parts/index.md
          - Components: noobguide/parts/components.md
          - PCB: noobguide/parts/pcb.md